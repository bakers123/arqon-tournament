<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ARQON — Dota 2 Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0B0B0D;
    --panel:    #1A1A1F;
    --panel-2:  #14141A;
    --border:   #2A2A33;
    --accent:   #7A3BFF;
    --accent-2: #9A6BFF;
    --text:     #F2F2F2;
    --text-dim: #8A8A96;
    --danger:   #DC2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Rajdhani', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at top left, rgba(122,59,255,0.08), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(122,59,255,0.05), transparent 50%);
  }
  header {
    background: rgba(11,11,13,0.95);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 40px; height: 40px; filter: drop-shadow(0 0 8px rgba(122,59,255,0.6)); }
  .brand-text { display: flex; flex-direction: column; }
  .brand-name {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 6px;
    color: var(--text);
    line-height: 1;
  }
  .brand-sub {
    font-family: 'Orbitron', sans-serif;
    font-size: 8px;
    letter-spacing: 4px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  nav { display: flex; gap: 6px; }
  nav button {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-dim);
    padding: 8px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: .2s;
  }
  nav button:hover { color: var(--text); }
  nav button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    box-shadow: 0 0 20px rgba(122,59,255,0.4);
  }
  main { max-width: 1080px; margin: 0 auto; padding: 28px; }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--accent);
    border-radius: 10px 0 0 10px;
    opacity: 0.6;
  }
  h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 16px;
    color: var(--text);
  }
  input, select {
    background: #0F0F14;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    width: 100%;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    transition: .2s;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(122,59,255,0.15); }
  select { cursor: pointer; }
  button.btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 11px 22px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: .2s;
    box-shadow: 0 0 15px rgba(122,59,255,0.3);
  }
  button.btn:hover:not(:disabled) {
    background: var(--accent-2);
    box-shadow: 0 0 25px rgba(122,59,255,0.5);
    transform: translateY(-1px);
  }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }
  button.btn.danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); box-shadow: none; }
  button.btn.danger:hover { background: var(--danger); color: white; box-shadow: 0 0 20px rgba(220,38,38,0.4); }
  button.btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-dim); box-shadow: none; }
  button.btn.ghost:hover { border-color: var(--accent); color: var(--text); }
  .row { display: flex; gap: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .label {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 6px;
    display: block;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .player {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #0F0F14;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    position: relative;
    transition: .2s;
  }
  .player:hover { border-color: var(--accent); }
  .player img { width: 48px; height: 48px; border-radius: 6px; border: 1px solid var(--border); object-fit: cover; }
  .player .name { font-weight: 700; font-size: 15px; letter-spacing: 0.5px; }
  .player .rank { font-size: 12px; margin-top: 3px; font-weight: 600; letter-spacing: 0.5px; }
  .player .remove {
    position: absolute;
    top: 4px; right: 8px;
    background: none; border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    transition: .2s;
  }
  .player .remove:hover { color: var(--danger); }
  .msg {
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 14px;
    margin-top: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .msg.error { background: rgba(220,38,38,0.12); color: #F87171; border: 1px solid rgba(220,38,38,0.3); }
  .msg.success { background: rgba(122,59,255,0.12); color: var(--accent-2); border: 1px solid rgba(122,59,255,0.3); }
  .bracket-wrap { overflow-x: auto; padding: 20px 0; }
  .bracket { display: flex; gap: 40px; min-width: max-content; }
  .round { display: flex; flex-direction: column; justify-content: space-around; gap: 14px; }
  .round-title {
    text-align: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
    font-weight: 700;
  }
  .match {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 230px;
    overflow: hidden;
    transition: .2s;
  }
  .match:hover { border-color: var(--accent); }
  .slot {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: .15s;
    background: transparent;
    border: none;
    color: inherit;
    width: 100%;
    text-align: left;
    font-family: 'Rajdhani', sans-serif;
    letter-spacing: 0.5px;
  }
  .slot:hover:not(:disabled) { background: rgba(122,59,255,0.1); }
  .slot:disabled { cursor: default; }
  .slot img { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; }
  .slot.winner { background: rgba(122,59,255,0.2); color: var(--accent-2); }
  .slot.winner::after { content: '✓'; margin-left: auto; color: var(--accent-2); font-weight: 900; }
  .slot .tbd { color: var(--text-dim); font-style: italic; }
  .divider { height: 1px; background: var(--border); }
  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 50px 0;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .tabs-inner { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs-inner button {
    padding: 8px 18px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    transition: .2s;
  }
  .tabs-inner button:hover { color: var(--text); }
  .tabs-inner button.active { background: var(--accent); border-color: var(--accent); color: white; }
  .hint { font-size: 12px; color: var(--text-dim); margin-top: 8px; letter-spacing: 0.5px; }
  .hint a { color: var(--accent-2); }
  .hint code { background: #0F0F14; padding: 2px 6px; border-radius: 4px; color: var(--accent-2); font-size: 11px; }
  .hidden { display: none; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F2F2F2"/>
          <stop offset="100%" stop-color="#8A8A96"/>
        </linearGradient>
      </defs>
      <polygon points="50,8 92,88 8,88" fill="none" stroke="url(#grad)" stroke-width="6" stroke-linejoin="miter"/>
      <path d="M 30,72 L 50,30 L 55,42 L 42,72 Z" fill="url(#grad)"/>
      <path d="M 62,60 L 50,30 L 45,42 L 58,72 L 72,72 L 62,60 Z" fill="url(#grad)" opacity="0.9"/>
      <rect x="30" y="55" width="40" height="6" fill="url(#grad)"/>
    </svg>
    <div class="brand-text">
      <div class="brand-name">ARQON</div>
      <div class="brand-sub">ESPORTS ORGANIZATION</div>
    </div>
  </div>
  <nav>
    <button data-tab="bracket" class="active">Сетка</button>
    <button data-tab="admin" id="admin-tab-btn" style="display:none;">Админ-панель</button>
  </nav>
</header>

<main>
  <section id="tab-admin" class="hidden">
    <div class="card">
      <h2>Настройки турнира</h2>
      <div class="row">
        <div style="flex:1">
          <label class="label">Формат</label>
          <select id="mode">
            <option value="1x1">1x1 (соло)</option>
            <option value="5x5" selected>5x5 (команды)</option>
          </select>
        </div>
        <div style="flex:1">
          <label class="label">Тип сетки</label>
          <select id="bracket-type">
            <option value="single">Single Elimination</option>
            <option value="double">Double Elimination</option>
          </select>
        </div>
        <div style="flex:1">
          <label class="label">Макс. участников</label>
          <select id="max-participants">
            <option>2</option><option>4</option><option selected>8</option>
            <option>16</option><option>32</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Добавить игрока</h2>
      <div class="hint" style="margin-bottom:12px; margin-top:0;">
        Открой профиль на <a href="https://www.opendota.com" target="_blank">opendota.com</a>,
        скопируй ник и ссылку на аватарку. Ранг выбери из списка.
      </div>
      <div class="row" style="margin-bottom:10px;">
        <div style="flex:2">
          <label class="label">Ник игрока</label>
          <input id="p-name" placeholder="Например: Dendi" />
        </div>
        <div style="flex:1">
          <label class="label">Ранг</label>
          <select id="p-rank">
            <option value="0">Без калибровки</option>
            <option value="11">Herald 1</option>
            <option value="12">Herald 2</option>
            <option value="13">Herald 3</option>
            <option value="14">Herald 4</option>
            <option value="15">Herald 5</option>
            <option value="21">Guardian 1</option>
            <option value="22">Guardian 2</option>
            <option value="23">Guardian 3</option>
            <option value="24">Guardian 4</option>
            <option value="25">Guardian 5</option>
            <option value="31">Crusader 1</option>
            <option value="32">Crusader 2</option>
            <option value="33">Crusader 3</option>
            <option value="34">Crusader 4</option>
            <option value="35">Crusader 5</option>
            <option value="41">Archon 1</option>
            <option value="42">Archon 2</option>
            <option value="43">Archon 3</option>
            <option value="44">Archon 4</option>
            <option value="45">Archon 5</option>
            <option value="51">Legend 1</option>
            <option value="52">Legend 2</option>
            <option value="53">Legend 3</option>
            <option value="54">Legend 4</option>
            <option value="55">Legend 5</option>
            <option value="61">Ancient 1</option>
            <option value="62">Ancient 2</option>
            <option value="63">Ancient 3</option>
            <option value="64">Ancient 4</option>
            <option value="65">Ancient 5</option>
            <option value="71">Divine 1</option>
            <option value="72">Divine 2</option>
            <option value="73">Divine 3</option>
            <option value="74">Divine 4</option>
            <option value="75">Divine 5</option>
            <option value="80">Immortal</option>
          </select>
        </div>
      </div>
      <div style="margin-bottom:10px;">
        <label class="label">Ссылка на аватарку (необязательно)</label>
        <input id="p-avatar" placeholder="https://..." />
      </div>
      <div class="row">
        <input id="player-input" placeholder="Steam ID (только для защиты от дублей)" />
        <button class="btn" id="add-player-btn">Добавить</button>
      </div>
      <div id="input-msg"></div>
    </div>

    <div class="card">
      <div class="tabs-inner">
        <button data-sub="solo" class="active">Соло игроки</button>
        <button data-sub="teams">Команды (5x5)</button>
      </div>
      <div id="sub-solo">
        <div id="solo-list" class="grid"></div>
        <div id="solo-empty" class="empty">Пока никого нет. Добавь игроков сверху.</div>
      </div>
      <div id="sub-teams" class="hidden">
        <div id="teams-list"></div>
        <button class="btn ghost" id="add-team-btn" style="width:100%; margin-top:10px;">
          + Добавить команду
        </button>
      </div>
    </div>

    <div class="card">
      <button class="btn" id="generate-bracket">🎲 Сгенерировать сетку</button>
      <button class="btn danger" id="reset-all" style="margin-left:10px;">Сбросить всё</button>
    </div>
  </section>

  <section id="tab-bracket">
    <div class="card">
      <div id="bracket-info" class="hint"></div>
    </div>
    <div class="bracket-wrap">
      <div id="bracket" class="bracket"></div>
    </div>
    <div id="bracket-empty" class="empty">
      Сетка пуста. Турнир ещё не сгенерирован.
    </div>
  </section>
</main>
<script>
const ADMIN_KEY = 'ARQON2026123123123123123';

function isAdmin() {
  const params = new URLSearchParams(window.location.search);
  return params.get('admin') === ADMIN_KEY;
}

const STATE_KEY = 'arqon_tournament_state';

let state = loadState() || {
  mode: '5x5',
  bracketType: 'single',
  maxParticipants: 8,
  soloPlayers: [],
  teams: [],
  bracket: null,
};

function saveState() { localStorage.setItem(STATE_KEY, JSON.stringify(state)); }
function loadState() {
  try { return JSON.parse(localStorage.getItem(STATE_KEY)); }
  catch { return null; }
}

async function fetchPlayer(steamIdInput) {
  const name = document.getElementById('p-name').value.trim();
  const avatar = document.getElementById('p-avatar').value.trim();
  const rankTier = parseInt(document.getElementById('p-rank').value) || 0;

  if (!name) throw new Error('Введи ник игрока');

  let accountId = steamIdInput.trim();
  if (!accountId) {
    accountId = 'manual_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  }

  const fallbackAvatar = 'https://ui-avatars.com/api/?name=' +
    encodeURIComponent(name.charAt(0)) +
    '&background=7A3BFF&color=F2F2F2&size=96&bold=true';

  return {
    account_id: accountId,
    name: name,
    avatar: avatar || fallbackAvatar,
    rank_tier: rankTier,
    leaderboard_rank: null,
  };
}

const MEDALS_EN = {1:'Herald',2:'Guardian',3:'Crusader',4:'Archon',5:'Legend',6:'Ancient',7:'Divine',8:'Immortal'};
const MEDALS_RU = {1:'Геральд',2:'Страж',3:'Крестоносец',4:'Архонт',5:'Легенда',6:'Древний',7:'Божество',8:'Титан'};

function parseRank(rankTier, lbRank) {
  if (!rankTier) return { name: 'Uncalibrated / Без калибровки', color: '#8A8A96', icon: '❔' };
  const medal = Math.floor(rankTier / 10);
  const star = rankTier % 10;
  if (medal === 8) {
    return { name: 'Immortal / Титан', color: '#ef4444', icon: '👑' };
  }
  const colors = {1:'#a1a1aa',2:'#a3a3a3',3:'#84cc16',4:'#22c55e',5:'#14b8a6',6:'#3b82f6',7:'#8b5cf6'};
  const en = MEDALS_EN[medal] ? MEDALS_EN[medal] + ' ' + star : '? ' + star;
  const ru = MEDALS_RU[medal] ? MEDALS_RU[medal] + ' ' + star : '? ' + star;
  return { name: en + ' / ' + ru, color: colors[medal] || '#8A8A96', icon: '⭐' };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function playerCardHTML(p, removeFn) {
  const rank = parseRank(p.rank_tier, p.leaderboard_rank);
  const removeBtn = isAdmin() ? '<button class="remove" onclick="' + removeFn + '">×</button>' : '';
  return '<div class="player">' +
    '<img src="' + p.avatar + '" alt="" onerror="this.style.display=\'none\'">' +
    '<div>' +
      '<div class="name">' + escapeHtml(p.name) + '</div>' +
      '<div class="rank" style="color:' + rank.color + '">' + rank.icon + ' ' + rank.name + '</div>' +
    '</div>' +
    removeBtn +
  '</div>';
}

function renderSolo() {
  const list = document.getElementById('solo-list');
  const empty = document.getElementById('solo-empty');
  if (!list || !empty) return;
  if (!state.soloPlayers.length) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  list.innerHTML = state.soloPlayers.map(p => playerCardHTML(p, "removeSolo('" + p.account_id + "')")).join('');
}

function renderTeams() {
  const list = document.getElementById('teams-list');
  if (!list) return;
  if (!state.teams.length) {
    list.innerHTML = '<div class="empty">Команд пока нет</div>';
    return;
  }
  const isAdm = isAdmin();
  list.innerHTML = state.teams.map(t => {
    const players = t.players.map(p => playerCardHTML(p, "removePlayerFromTeam('" + t.id + "','" + p.account_id + "')")).join('');
    const removeTeamBtn = isAdm ? '<button class="btn danger" onclick="removeTeam(\'' + t.id + '\')">Удалить</button>' : '';
    const nameInput = isAdm
      ? '<input value="' + escapeHtml(t.name) + '" onchange="renameTeam(\'' + t.id + '\', this.value)" style="flex:1; font-weight:700; letter-spacing:1px;" />'
      : '<input value="' + escapeHtml(t.name) + '" disabled style="flex:1; font-weight:700; letter-spacing:1px;" />';
    return '<div class="card" style="margin-bottom:12px;">' +
      '<div class="row" style="align-items:center; margin-bottom:10px;">' +
        nameInput +
        '<span class="hint" style="margin:0;">' + t.players.length + '/5</span>' +
        removeTeamBtn +
      '</div>' +
      '<div class="grid">' + players + '</div>' +
    '</div>';
  }).join('');
}

async function handleAddPlayer() {
  if (!isAdmin()) return;
  const input = document.getElementById('player-input');
  const msg = document.getElementById('input-msg');
  const btn = document.getElementById('add-player-btn');
  const val = input.value.trim();
  btn.disabled = true;
  btn.textContent = 'Загрузка...';
  msg.innerHTML = '';
  try {
    const player = await fetchPlayer(val);
    if (state.mode === '1x1') {
      if (state.soloPlayers.find(p => p.account_id === player.account_id)) {
        throw new Error('Этот игрок уже добавлен');
      }
      state.soloPlayers.push(player);
      renderSolo();
    } else {
      if (!state.teams.length) {
        state.teams.push({ id: genId(), name: 'Team 1', players: [] });
      }
      const team = state.teams[state.teams.length - 1];
      if (team.players.length >= 5) {
        state.teams.push({ id: genId(), name: 'Team ' + (state.teams.length + 1), players: [player] });
      } else {
        if (team.players.find(p => p.account_id === player.account_id)) {
          throw new Error('Этот игрок уже в команде');
        }
        team.players.push(player);
      }
      renderTeams();
    }
    input.value = '';
    document.getElementById('p-name').value = '';
    document.getElementById('p-avatar').value = '';
    document.getElementById('p-rank').value = '0';
    msg.innerHTML = '<div class="msg success">✓ ' + escapeHtml(player.name) + ' добавлен</div>';
    saveState();
  } catch (e) {
    msg.innerHTML = '<div class="msg error">✕ ' + escapeHtml(e.message) + '</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Добавить';
  }
}

function removeSolo(accId) {
  if (!isAdmin()) return;
  state.soloPlayers = state.soloPlayers.filter(p => p.account_id !== accId);
  renderSolo(); saveState();
}
function removeTeam(id) {
  if (!isAdmin()) return;
  state.teams = state.teams.filter(t => t.id !== id);
  renderTeams(); saveState();
}
function renameTeam(id, name) {
  if (!isAdmin()) return;
  const t = state.teams.find(t => t.id === id);
  if (t) { t.name = name; saveState(); }
}
function removePlayerFromTeam(teamId, accId) {
  if (!isAdmin()) return;
  const t = state.teams.find(t => t.id === teamId);
  if (t) { t.players = t.players.filter(p => p.account_id !== accId); renderTeams(); saveState(); }
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function generateBracket() {
  if (!isAdmin()) return;
  let participants;
  if (state.mode === '1x1') {
    participants = state.soloPlayers.map(p => ({ id: 'p' + p.account_id, name: p.name, avatar: p.avatar }));
  } else {
    participants = state.teams.filter(t => t.players.length > 0).map(t => ({
      id: t.id, name: t.name, avatar: t.players[0] ? t.players[0].avatar : ''
    }));
  }
  if (participants.length < 2) { alert('Нужно минимум 2 участника'); return; }
  if (participants.length > state.maxParticipants) participants = participants.slice(0, state.maxParticipants);

  const size = Math.pow(2, Math.ceil(Math.log2(participants.length)));
  const slots = shuffle(participants);
  while (slots.length < size) slots.push(null);

  const rounds = [];
  let current = [];
  for (let i = 0; i < slots.length; i += 2) {
    current.push({ id: 'r1-' + (i / 2), round: 0, p1: slots[i], p2: slots[i + 1], winner: null });
  }
  rounds.push(current);
  let rIdx = 1;
  while (current.length > 1) {
    const next = [];
    for (let i = 0; i < current.length; i += 2) {
      next.push({ id: 'r' + (rIdx + 1) + '-' + (i / 2), round: rIdx, p1: null, p2: null, winner: null });
    }
    rounds.push(next);
    current = next;
    rIdx++;
  }
  state.bracket = { rounds, type: 'single', mode: state.mode };
  saveState();
  switchTab('bracket');
  renderBracket();
}

function countParticipants() {
  const r1 = state.bracket.rounds[0];
  let total = 0;
  for (const m of r1) {
    if (m.p1) total++;
    if (m.p2) total++;
  }
  return total;
}

function matchHTML(match) {
  const canPlay = isAdmin() && match.p1 && match.p2;
  const p1Winner = match.p1 && match.winner && match.winner.id === match.p1.id;
  const p2Winner = match.p2 && match.winner && match.winner.id === match.p2.id;
  return '<div class="match">' +
    slotHTML(match.p1, p1Winner, canPlay, "setWinner('" + match.id + "', 1)") +
    '<div class="divider"></div>' +
    slotHTML(match.p2, p2Winner, canPlay, "setWinner('" + match.id + "', 2)") +
  '</div>';
}

function slotHTML(player, isWinner, canPlay, onClick) {
  if (!player) {
    return '<div class="slot"><span class="tbd">TBD</span></div>';
  }
  const cls = isWinner ? 'winner' : '';
  const clickAttr = canPlay ? ' onclick="' + onClick + '"' : ' disabled';
  return '<button class="slot ' + cls + '"' + clickAttr + '>' +
    (player.avatar ? '<img src="' + player.avatar + '" onerror="this.style.display=\'none\'">' : '') +
    '<span>' + escapeHtml(player.name) + '</span>' +
  '</button>';
}

function renderBracket() {
  const wrap = document.getElementById('bracket');
  const empty = document.getElementById('bracket-empty');
  const info = document.getElementById('bracket-info');
  if (!wrap) return;
  if (!state.bracket) {
    wrap.innerHTML = '';
    empty.classList.remove('hidden');
    info.innerHTML = '';
    return;
  }
  empty.classList.add('hidden');
  const rounds = state.bracket.rounds;
  info.innerHTML = 'Формат: <b style="color:var(--accent-2)">' + state.bracket.mode + '</b> · Тип: <b style="color:var(--accent-2)">Single Elimination</b> · Участников: <b style="color:var(--accent-2)">' + countParticipants() + '</b>';
  wrap.innerHTML = rounds.map((round, ri) => {
    const title = ri === rounds.length - 1 ? '🏆 Финал' : 'Раунд ' + (ri + 1);
    return '<div class="round">' +
      '<div class="round-title">' + title + '</div>' +
      round.map(m => matchHTML(m)).join('') +
    '</div>';
  }).join('');
}

function setWinner(matchId, slot) {
  if (!isAdmin()) return;
  const rounds = state.bracket.rounds;
  let match = null, rIdx = -1, mIdx = -1;
  rounds.forEach((r, ri) => r.forEach((m, mi) => {
    if (m.id === matchId) { match = m; rIdx = ri; mIdx = mi; }
  }));
  if (!match) return;
  const winner = slot === 1 ? match.p1 : match.p2;
  const loser = slot === 1 ? match.p2 : match.p1;
  if (!winner || !loser) return;
  if (match.winner && match.winner.id !== winner.id && rIdx + 1 < rounds.length) {
    const nextMatch = rounds[rIdx + 1][Math.floor(mIdx / 2)];
    const slotKey = (mIdx % 2 === 0) ? 'p1' : 'p2';
    if (nextMatch && nextMatch[slotKey] && nextMatch[slotKey].id === match.winner.id) {
      nextMatch[slotKey] = null;
      nextMatch.winner = null;
    }
  }
  match.winner = winner;
  if (rIdx + 1 < rounds.length) {
    const nextMatch = rounds[rIdx + 1][Math.floor(mIdx / 2)];
    const slotKey = (mIdx % 2 === 0) ? 'p1' : 'p2';
    nextMatch[slotKey] = winner;
    nextMatch.winner = null;
  } else {
    setTimeout(() => alert('🏆 Победитель турнира: ' + winner.name), 150);
  }
  saveState();
  renderBracket();
}

function switchTab(tab) {
  document.querySelectorAll('nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  const adminSection = document.getElementById('tab-admin');
  const bracketSection = document.getElementById('tab-bracket');
  if (adminSection) adminSection.classList.toggle('hidden', tab !== 'admin');
  if (bracketSection) bracketSection.classList.toggle('hidden', tab !== 'bracket');
  if (tab === 'bracket') renderBracket();
}

function switchSubTab(sub) {
  document.querySelectorAll('[data-sub]').forEach(b => {
    b.classList.toggle('active', b.dataset.sub === sub);
  });
  const solo = document.getElementById('sub-solo');
  const teams = document.getElementById('sub-teams');
  if (solo) solo.classList.toggle('hidden', sub !== 'solo');
  if (teams) teams.classList.toggle('hidden', sub !== 'teams');
}

function genId() {
  return 't' + Math.random().toString(36).slice(2, 10);
}

function checkAdminAccess() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('admin') === ADMIN_KEY) {
    const btn = document.getElementById('admin-tab-btn');
    if (btn) btn.style.display = 'inline-block';
    switchTab('admin');
  } else {
    switchTab('bracket');
  }
}

function renderAll() {
  renderSolo();
  renderTeams();
  renderBracket();
}

function init() {
  document.querySelectorAll('nav button').forEach(b => {
    b.onclick = () => switchTab(b.dataset.tab);
  });
  document.querySelectorAll('[data-sub]').forEach(b => {
    b.onclick = () => switchSubTab(b.dataset.sub);
  });
  const modeSel = document.getElementById('mode');
  const typeSel = document.getElementById('bracket-type');
  const maxSel = document.getElementById('max-participants');
  if (modeSel) {
    modeSel.value = state.mode;
    modeSel.onchange = e => { state.mode = e.target.value; saveState(); renderAll(); };
  }
  if (typeSel) {
    typeSel.value = state.bracketType;
    typeSel.onchange = e => { state.bracketType = e.target.value; saveState(); };
  }
  if (maxSel) {
    maxSel.value = state.maxParticipants;
    maxSel.onchange = e => { state.maxParticipants = +e.target.value; saveState(); };
  }
  const addBtn = document.getElementById('add-player-btn');
  const playerInput = document.getElementById('player-input');
  if (addBtn) addBtn.onclick = handleAddPlayer;
  if (playerInput) playerInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleAddPlayer();
  });
  const addTeamBtn = document.getElementById('add-team-btn');
  const genBtn = document.getElementById('generate-bracket');
  const resetBtn = document.getElementById('reset-all');
  if (addTeamBtn) addTeamBtn.onclick = () => {
    if (!isAdmin()) return;
    state.teams.push({ id: genId(), name: 'Team ' + (state.teams.length + 1), players: [] });
    renderTeams(); saveState();
  };
  if (genBtn) genBtn.onclick = generateBracket;
  if (resetBtn) resetBtn.onclick = () => {
    if (!isAdmin()) return;
    if (!confirm('Удалить весь турнир?')) return;
    state.soloPlayers = [];
    state.teams = [];
    state.bracket = null;
    saveState();
    renderAll();
    switchTab('admin');
    alert('Готово');
  };
  checkAdminAccess();
  renderAll();
}

window.removeSolo = removeSolo;
window.removeTeam = removeTeam;
window.renameTeam = renameTeam;
window.removePlayerFromTeam = removePlayerFromTeam;
window.setWinner = setWinner;

init();
</script>
</body>
</html>
