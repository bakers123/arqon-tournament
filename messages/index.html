<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090812"><meta name="description" content="Личные сообщения друзей ARQON Esports">
<title>Сообщения — ARQON Esports</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#090812;--panel:#11101b;--line:rgba(173,132,255,.2);--violet:#9b5cff;--pink:#c084fc;--muted:#9b96aa;--white:#f7f3ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -15%,rgba(117,61,207,.28),transparent 48%),var(--bg);color:var(--white);font-family:Rajdhani,system-ui,sans-serif}
a{color:inherit;text-decoration:none}.top{min-height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px clamp(14px,5vw,72px);background:#090812e8;position:sticky;top:0;z-index:3;backdrop-filter:blur(16px)}
.brand{font:800 17px Orbitron;letter-spacing:2px}.brand span{color:var(--pink)}.back{border:1px solid var(--line);padding:8px 13px;border-radius:9px;color:#ded2f6;font-weight:700}
main{width:min(1120px,calc(100% - 26px));margin:28px auto 60px}.eyebrow{font:700 10px Orbitron;letter-spacing:2px;color:#bd9aff}.heading{font:800 clamp(25px,5vw,38px) Orbitron;margin:8px 0}.lead{color:var(--muted);font-size:16px;margin:0 0 18px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;min-height:570px}.panel{background:linear-gradient(160deg,#171426ee,#100f19f2);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.panel-title{padding:15px 17px;border-bottom:1px solid #ffffff12;font:700 12px Orbitron;letter-spacing:1px}.friends{padding:8px;display:grid;gap:5px;max-height:510px;overflow:auto}
.friend{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid transparent;border-radius:11px;background:#ffffff05;text-align:left;color:inherit;cursor:pointer;width:100%;font:inherit}
.friend.active{border-color:#9b5cff88;background:#7136c933}.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:11px;object-fit:cover;background:linear-gradient(135deg,#6d28d9,#c084fc);display:grid;place-items:center;font-weight:700}
.friend-name{font-size:17px;font-weight:700;overflow-wrap:anywhere}.friend-meta{font-size:12px;color:var(--muted)}.unread-pill{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:20px;background:#ef477f;color:#fff;font:800 11px Arial;margin-left:auto;flex:0 0 auto}.total-unread{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:20px;background:#ef477f;color:white;font:800 11px Arial;vertical-align:middle;margin-left:8px}
.chat{display:flex;flex-direction:column;min-height:570px}.chat-head{padding:14px 17px;border-bottom:1px solid #ffffff12;font-weight:700;font-size:18px}.messages{padding:16px;display:flex;flex-direction:column;gap:9px;overflow:auto;flex:1;max-height:430px;min-height:300px}
.bubble{max-width:min(78%,560px);padding:10px 13px;border-radius:13px;background:#ffffff0c;border:1px solid #ffffff12;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;font-size:16px}
.bubble.mine{align-self:flex-end;background:#7136c933;border-color:#9b5cff55}.time{display:block;font-size:11px;color:#aaa1bb;margin-top:4px;text-align:right}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid #ffffff12}.composer textarea{resize:vertical;min-height:44px;max-height:120px;flex:1;background:#0b0a13;border:1px solid #ffffff20;border-radius:10px;color:white;padding:10px;font:16px Rajdhani;outline:none}.composer textarea:focus{border-color:#9b5cff}.btn{border:1px solid #9b5cff88;border-radius:10px;padding:9px 15px;background:linear-gradient(135deg,#7136c9,#9b5cff);color:white;font:700 14px Rajdhani;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.state{color:var(--muted);padding:22px 12px;text-align:center;font-size:16px}.error{color:#ff9baf}.hint{font-size:12px;color:var(--muted);padding:0 14px 12px}
@media(max-width:700px){main{margin-top:20px}.layout{grid-template-columns:1fr;min-height:0}.friends{display:flex;max-height:none;overflow-x:auto}.friend{flex:0 0 190px}.chat{min-height:480px}.messages{min-height:280px;max-height:55vh}.bubble{max-width:88%}.panel-title{padding:12px 14px}}
</style></head><body>
<header class="top"><a class="brand" href="/"><span>ARQON</span> ESPORTS</a><a class="back" href="/social/">← Сообщество</a></header>
<main><div class="eyebrow">ARQON COMMUNITY</div><h1 class="heading">СООБЩЕНИЯ <span class="total-unread" id="total-unread" hidden>0</span></h1><p class="lead">Личные переписки доступны только между друзьями.</p>
<div class="layout"><section class="panel"><div class="panel-title">ДРУЗЬЯ</div><div class="friends" id="friends"><div class="state">Проверяем вход…</div></div></section>
<section class="panel chat"><div class="chat-head" id="chat-title">Выбери друга</div><div class="messages" id="messages"><div class="state">Выбери друга слева, чтобы открыть переписку.</div></div><div class="hint" id="chat-hint">Сообщения видны только участникам переписки.</div><form class="composer" id="composer"><textarea id="message-input" maxlength="2000" placeholder="Напиши сообщение…" disabled required></textarea><button class="btn" id="send" type="submit" disabled>Отправить</button></form></section></div></main>
<script>
const SUPABASE_URL='https://uscnaqcvuwjrmkjyuklp.supabase.co';
const SUPABASE_KEY='sb_publishable_oE2Bc1wPAcDt6HE8bOUj3Q_0-2FfIxB';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let me=null,selected=null,friends=[],poll=null,unreadBySender={};
function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function profileHref(id){return '/players/profile/?id='+encodeURIComponent(id)}
function fmt(ts){return new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function renderFriends(){const host=$('friends');host.replaceChildren();if(!friends.length){host.append(node('div','state','Пока нет друзей. Добавь игроков через раздел «Сообщество».'));return}
 friends.forEach(f=>{const b=node('button','friend'+(selected?.user_id===f.user_id?' active':''));b.type='button';const av=f.avatar_url&&/^https:\/\//i.test(f.avatar_url)?node('img','avatar'):node('div','avatar',(f.display_name||'A').trim().charAt(0).toUpperCase());
 if(av.tagName==='IMG'){av.src=f.avatar_url;av.alt='';av.loading='lazy';av.referrerPolicy='no-referrer';av.onerror=()=>{const fallback=node('div','avatar',(f.display_name||'A').trim().charAt(0).toUpperCase());av.replaceWith(fallback)}}
 const info=node('div');info.append(node('div','friend-name',f.display_name||('Игрок #'+f.arqon_id)),node('div','friend-meta','ARQON ID · #'+f.arqon_id));b.append(av,info);const unread=unreadBySender[f.user_id]||0;if(unread){const pill=node('span','unread-pill',unread>99?'99+':String(unread));pill.setAttribute('aria-label',unread+' непрочитанных сообщений');b.append(pill)}b.addEventListener('click',()=>openChat(f));host.append(b)});
}
async function loadFriends(){const {data,error}=await db.rpc('get_arqon_social_connections',{p_section:'friends'});if(error)throw error;friends=Array.isArray(data)?data:[];await loadUnreadCounts();renderFriends()}
async function loadUnreadCounts(){if(!me)return;const {data,error}=await db.from('arqon_direct_messages').select('sender_user_id').eq('recipient_user_id',me).is('read_at',null).limit(500);if(error){console.warn('Unread count load failed',error);return}unreadBySender={};(data||[]).forEach(row=>{unreadBySender[row.sender_user_id]=(unreadBySender[row.sender_user_id]||0)+1});const total=Object.values(unreadBySender).reduce((a,b)=>a+b,0),badge=$('total-unread');badge.textContent=total>99?'99+':String(total);badge.hidden=!total;renderFriends()}
function messageQuery(peer){return db.from('arqon_direct_messages').select('id,sender_user_id,recipient_user_id,message,created_at,read_at').or('and(sender_user_id.eq.'+me+',recipient_user_id.eq.'+peer+'),and(sender_user_id.eq.'+peer+',recipient_user_id.eq.'+me+')').order('created_at',{ascending:true}).limit(100)}
function renderMessages(rows){const host=$('messages');host.replaceChildren();if(!rows.length){host.append(node('div','state','Это начало вашей переписки. Напиши первое сообщение!'));return}
 rows.forEach(m=>{const b=node('div','bubble'+(m.sender_user_id===me?' mine':''));b.append(document.createTextNode(m.message));b.append(node('span','time',fmt(m.created_at)+(m.sender_user_id===me?(m.read_at?' · Прочитано':' · Отправлено'):'')));host.append(b)});host.scrollTop=host.scrollHeight}
async function loadMessages(){if(!selected)return;const {data,error}=await messageQuery(selected.user_id);if(error){$('messages').replaceChildren(node('div','state error','Не удалось загрузить сообщения.'));console.warn(error);return}
 renderMessages(data||[]);const unread=(data||[]).filter(m=>m.sender_user_id===selected.user_id&&!m.read_at).map(m=>m.id);
 if(unread.length){const {error:readError}=await db.from('arqon_direct_messages').update({read_at:new Date().toISOString()}).in('id',unread);if(readError)console.warn('Read receipt failed',readError);else await loadUnreadCounts()}
}
async function openChat(friend){selected=friend;renderFriends();$('chat-title').textContent=friend.display_name||('Игрок #'+friend.arqon_id);$('message-input').disabled=false;$('send').disabled=false;$('messages').replaceChildren(node('div','state','Загружаем переписку…'));await loadMessages();if(poll)clearInterval(poll);poll=setInterval(async()=>{await loadMessages();await loadUnreadCounts()},12000)}
$('composer').addEventListener('submit',async e=>{e.preventDefault();if(!me||!selected)return;const input=$('message-input'),message=input.value.trim();if(!message)return;if(message.length>2000){$('chat-hint').textContent='Максимум 2000 символов.';return}
 const send=$('send');send.disabled=true;const {error}=await db.from('arqon_direct_messages').insert({sender_user_id:me,recipient_user_id:selected.user_id,message});
 send.disabled=false;if(error){$('chat-hint').textContent=error.message==='new row violates row-level security policy'?'Писать можно только друзьям, если между вами нет блокировки.':'Не удалось отправить сообщение. Попробуй ещё раз.';console.warn(error);return}
 input.value='';$('chat-hint').textContent='Сообщение отправлено.';await loadMessages();input.focus()
});
(async()=>{try{const {data,error}=await db.auth.getUser();if(error||!data?.user){$('friends').replaceChildren(node('div','state error','Войди в аккаунт ARQON, чтобы пользоваться сообщениями.'));$('messages').replaceChildren(node('div','state','Сначала авторизуйся на сайте.'));return}
 me=data.user.id;await loadFriends()}catch(e){$('friends').replaceChildren(node('div','state error','Не удалось загрузить друзей. Обнови страницу.'));console.error(e)}})();
window.addEventListener('beforeunload',()=>{if(poll)clearInterval(poll)});
</script></body></html>
