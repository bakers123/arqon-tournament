<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Апелляции — ARQON</title><link rel="icon" href="/logo.png"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>
:root{color-scheme:dark;--bg:#090812;--line:#a78bfa33;--muted:#a99fba;--white:#f7f3ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#753dcb44,transparent 48%),var(--bg);color:var(--white);font-family:Rajdhani,system-ui,sans-serif}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid var(--line)}a{color:#d8c5ff;text-decoration:none}.brand{font:800 14px Orbitron;letter-spacing:2px}.wrap{width:min(900px,calc(100% - 28px));margin:28px auto 60px}h1{font:800 clamp(22px,4vw,32px) Orbitron}.muted{color:var(--muted)}.card{padding:17px;margin:14px 0;border:1px solid var(--line);border-radius:14px;background:#151222}.btn,textarea{font:700 15px Rajdhani;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#1b172a;color:white}.btn{cursor:pointer}.primary{background:#7540d7;border-color:#9b5cff}textarea{width:100%;min-height:110px;resize:vertical}.notice{padding:12px;border-radius:9px;background:#8b5cf622;margin:12px 0}.error{background:#ef444422;color:#fecaca}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.tag{padding:3px 8px;border-radius:20px;background:#8b5cf633;color:#e4d5ff}.appeal{border-top:1px solid #ffffff16;margin-top:12px;padding-top:12px}@media(max-width:600px){header{padding:0 14px}}
</style></head><body><header><a class="brand" href="/">ARQON ESPORTS</a><a href="/players/profile/">Мой профиль</a></header><main class="wrap"><div class="muted">ARQON · COMMUNITY</div><h1>АПЕЛЛЯЦИИ</h1><p class="muted">Если ты считаешь санкцию ошибочной, отправь обращение модераторам. Апелляция не снимает ограничение автоматически — решение принимает модерация.</p><div id="notice" class="notice" hidden></div><div id="auth" class="card">Проверяем авторизацию…</div><div id="items"></div></main><script>
(()=>{const db=window.supabase.createClient('https://uscnaqcvuwjrmkjyuklp.supabase.co','sb_publishable_oE2Bc1wPAcDt6HE8bOUj3Q_0-2FfIxB'),$=id=>document.getElementById(id);const say=(s,bad=false)=>{$('notice').hidden=!s;$('notice').textContent=s;$('notice').classList.toggle('error',bad)};const names={warning:'Предупреждение',restriction:'Ограничение функций',account_block:'Блокировка сообщества'},states={pending:'На рассмотрении',accepted:'Удовлетворена',rejected:'Отклонена'};async function load(){const {data:{user}}=await db.auth.getUser();if(!user){$('auth').textContent='Войди в ARQON, чтобы посмотреть свои санкции и подать апелляцию.';return}$('auth').textContent='';const {data,error}=await db.rpc('get_my_arqon_sanction_appeals');if(error){say('Не удалось загрузить обращения: '+error.message,true);return}const root=$('items');root.replaceChildren();if(!data?.length){const p=document.createElement('p');p.className='muted';p.textContent='У тебя пока нет санкций и апелляций.';root.append(p);return}data.forEach(s=>{const card=document.createElement('section');card.className='card';const head=document.createElement('div');head.className='row';const title=document.createElement('strong');title.textContent='#'+s.sanction_id+' · '+(names[s.sanction_type]||s.sanction_type);const tag=document.createElement('span');tag.className='tag';tag.textContent=s.sanction_active?'Действует':'Не действует';head.append(title,tag);const reason=document.createElement('p');reason.textContent='Причина санкции: '+s.sanction_reason;card.append(head,reason);if(s.sanction_expires_at){const expiry=document.createElement('p');expiry.className='muted';expiry.textContent='До '+new Date(s.sanction_expires_at).toLocaleString('ru-RU');card.append(expiry)}const appeal=document.createElement('div');appeal.className='appeal';const status=document.createElement('strong');status.textContent='Апелляция: '+(states[s.appeal_status]||'Не подана');appeal.append(status);if(s.appeal_message){const msg=document.createElement('p');msg.textContent=s.appeal_message;appeal.append(msg)}if(s.moderator_response){const response=document.createElement('p');response.className='muted';response.textContent='Ответ модерации: '+s.moderator_response;appeal.append(response)}if(s.sanction_active&&s.appeal_status!=='pending'){const form=document.createElement('form');const field=document.createElement('textarea');field.required=true;field.minLength=10;field.maxLength=2000;field.placeholder='Объясни, почему решение нужно пересмотреть (10–2000 символов)';const btn=document.createElement('button');btn.type='submit';btn.className='btn primary';btn.textContent='Подать апелляцию';form.append(field,document.createElement('br'),btn);form.addEventListener('submit',async e=>{e.preventDefault();const message=field.value.trim();if(message.length<10||message.length>2000){say('Текст должен быть от 10 до 2000 символов.',true);return}btn.disabled=true;const result=await db.rpc('submit_arqon_sanction_appeal',{p_sanction_id:s.sanction_id,p_message:message});if(result.error){say(result.error.message==='pending_appeal_already_exists'?'По этой санкции уже есть апелляция на рассмотрении.':'Не удалось отправить апелляцию: '+result.error.message,true);btn.disabled=false;return}say('Апелляция отправлена модераторам ARQON.');await load()});appeal.append(form)}card.append(appeal);root.append(card)})}db.auth.getUser().then(({data})=>{if(!data?.user){$('auth').textContent='Войди в ARQON, чтобы продолжить.';return}load()}).catch(()=>say('Не удалось проверить авторизацию.',true))})();
</script></body></html>
