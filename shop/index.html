<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090812"><title>Магазин ARQON — ARQON Esports</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#090812;--panel:#15111f;--line:#302641;--accent:#9b5cff;--muted:#aaa0b9;--text:#f7f3ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,rgba(124,58,237,.2),transparent 42%),var(--bg);color:var(--text);font-family:Rajdhani,sans-serif;min-height:100vh}header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;padding:15px max(18px,calc((100% - 1180px)/2));background:#0c0914ed;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}a{color:#d9c4ff;text-decoration:none}.brand{font:800 18px Orbitron;color:#fff;letter-spacing:2px}main{width:min(1180px,calc(100% - 28px));margin:30px auto 70px}.hero{display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:24px}.eyebrow,.rarity{color:#bda2ff;font:700 10px Orbitron;letter-spacing:2px}.hero h1{font:800 clamp(25px,5vw,42px) Orbitron;margin:8px 0}.hero p{color:var(--muted);font-size:17px;margin:0;max-width:650px}.wallet{border:1px solid #7651aa;background:linear-gradient(135deg,#241638,#130f1d);padding:14px 18px;border-radius:14px;min-width:170px}.wallet small{display:block;color:#bda2ff;font:700 10px Orbitron}.wallet strong{font:800 25px Orbitron;display:block;margin:5px 0}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px}.tab,.buy{border:1px solid var(--line);background:#15111f;color:#c9bddb;border-radius:9px;padding:9px 14px;font:700 13px Rajdhani;white-space:nowrap;cursor:pointer}.tab.active,.buy{background:#6d35b4;border-color:#a978ff;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));gap:15px}.item,.history{border:1px solid var(--line);border-radius:15px;background:linear-gradient(160deg,#1a1425,#100d17);padding:16px;min-width:0}.item{display:flex;flex-direction:column;gap:11px}.preview{height:126px;border-radius:11px;background:radial-gradient(circle,#3a245b,#100d18 70%);display:grid;place-items:center}.avatar{width:76px;height:76px;border-radius:22px;background:linear-gradient(145deg,#32264a,#0c0a12);display:grid;place-items:center;font:800 26px Orbitron;color:#e9d5ff;border:3px solid #9b5cff;box-shadow:0 0 20px #9b5cff88}.avatar.cyber{border-color:#45d8ff;box-shadow:0 0 24px #45d8ff88}.avatar.champion{border:4px solid #f3c969;box-shadow:0 0 24px #f3c96988}.theme{width:90%;height:75px;border-radius:9px;border:1px solid #8b5cf6;background:linear-gradient(110deg,#211438,#4b2672,#15101d)}.theme.crimson{background:linear-gradient(110deg,#28101c,#792b4c,#1a1020);border-color:#e45c8a}.demo-title{font:800 18px Orbitron;color:#e9d5ff;text-shadow:0 0 20px #9b5cff}.name{font:800 17px Orbitron}.desc{color:var(--muted);font-size:15px;min-height:36px}.price-row,.tx{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font:800 17px Orbitron;color:#e4ceff}.buy:disabled{opacity:.45;cursor:not-allowed}.owned{background:#20202b;border-color:#4b4556;color:#cfc6db}.history{margin-top:24px;padding:16px}.history h2{font:700 12px Orbitron;letter-spacing:1.4px}.tx{padding:9px 0;border-top:1px solid #ffffff12;color:#c8bdd6}.tx b{white-space:nowrap}.positive{color:#8ee5b0}.negative{color:#ff9caa}.notice{padding:12px 14px;border-radius:10px;margin:12px 0;background:#211832;border:1px solid #69449b;color:#eadcff}.muted{color:var(--muted)}@media(max-width:560px){header{padding:12px 14px}main{margin-top:22px}.wallet{width:100%}.item{padding:13px}}
</style></head><body><header><a class="brand" href="/">ARQON ESPORTS</a><a href="/players/">← Игроки</a></header><main>
<section class="hero"><div><div class="eyebrow">ARQON COINS / COSMETICS</div><h1>МАГАЗИН ARQON</h1><p>Прокачай внешний вид профиля. Покупки остаются в инвентаре и не влияют на игровой рейтинг или результаты матчей.</p></div><div class="wallet"><small>ТВОЙ БАЛАНС</small><strong id="balance">— ◈</strong><a href="/players/profile/?me=1">Мой профиль →</a></div></section>
<div id="notice" class="notice" hidden></div><div class="tabs" id="tabs"><button class="tab active" data-filter="all">Всё</button><button class="tab" data-filter="frame">Рамки</button><button class="tab" data-filter="theme">Оформление</button><button class="tab" data-filter="title">Титулы</button><button class="tab" data-filter="badge">Значки</button></div>
<div class="grid" id="items"><p class="muted">Загружаем каталог…</p></div><section class="history"><h2>МОЙ ИНВЕНТАРЬ</h2><div id="inventory" class="muted">Загружаем предметы…</div></section><section class="history"><h2>ИСТОРИЯ COINS</h2><div id="history" class="muted">Загружаем историю…</div></section></main>
<script>
const SUPABASE_URL='https://uscnaqcvuwjrmkjyuklp.supabase.co';const SUPABASE_KEY='sb_publishable_oE2Bc1wPAcDt6HE8bOUj3Q_0-2FfIxB';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let balance=0,items=[],owned=new Set(),equipped={},filter='all';
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(s,bad=false){$('notice').hidden=false;$('notice').textContent=s;$('notice').style.borderColor=bad?'#a94459':'#69449b'}
function preview(x){if(x.category==='frame')return '<div class="avatar '+esc(x.preview_style)+'">A</div>';if(x.category==='theme')return '<div class="theme '+(x.preview_style==='crimson'?'crimson':'')+'"></div>';return '<div class="demo-title">'+(x.category==='title'?'ARQON':'✦ ARQON')+'</div>'}
function render(){const list=items.filter(x=>filter==='all'||x.category===filter);$('items').innerHTML=list.map(x=>{const has=owned.has(x.id),poor=balance<Number(x.price);return '<article class="item"><div class="preview">'+preview(x)+'</div><div class="rarity">'+esc(x.rarity.toUpperCase())+' · '+esc(x.category.toUpperCase())+'</div><div class="name">'+esc(x.name)+'</div><div class="desc">'+esc(x.description)+'</div><div class="price-row"><div class="price">'+Number(x.price).toLocaleString('ru-RU')+' ◈</div><button class="buy '+(has?'owned':'')+'" data-buy="'+esc(x.id)+'" '+(has||poor?'disabled':'')+'>'+(has?'Куплено':poor?'Не хватает':'Купить')+'</button></div></article>'}).join('')||'<p class="muted">В этой категории пока нет предметов.</p>';$('inventory').innerHTML=items.filter(x=>owned.has(x.id)).map(x=>{const field=x.category==='frame'?'equipped_frame_id':x.category==='theme'?'equipped_theme_id':x.category==='title'?'equipped_title_id':null;const active=field&&equipped[field]===x.id;return '<div class="tx"><span>'+esc(x.name)+'</span><span><b>'+x.category.toUpperCase()+'</b> '+(field?'<button class="tab" data-equip="'+esc(x.id)+'" '+(active?'disabled':'')+'>'+(active?'Надето':'Надеть')+'</button>':'')+'</span></div>'})||'Пока пусто — выбери первый предмет в магазине.'}
async function load(){const {data:{user},error:authError}=await db.auth.getUser();if(authError||!user){$('items').innerHTML='<p class="muted">Войди через Steam на странице Игроки, чтобы открыть магазин.</p>';msg('Сначала войди в аккаунт ARQON.',true);$('inventory').textContent='Доступно после входа';$('history').textContent='Доступно после входа';return}const {data:p,error:pe}=await db.from('profiles').select('arqon_id').eq('user_id',user.id).maybeSingle();if(pe||!p){msg('Не удалось найти профиль ARQON.',true);return}const id=p.arqon_id;const [w,c,i,t,pr]=await Promise.all([db.from('arqon_coin_wallets').select('balance').eq('arqon_id',id).maybeSingle(),db.from('arqon_shop_items').select('*').eq('is_active',true).order('price'),db.from('arqon_shop_inventory').select('item_id').eq('arqon_id',id),db.from('arqon_coin_transactions').select('amount,description,transaction_type,created_at').eq('arqon_id',id).order('created_at',{ascending:false}).limit(12),db.from('profiles').select('equipped_frame_id,equipped_theme_id,equipped_title_id').eq('user_id',user.id).maybeSingle()]);if(w.error||c.error||i.error||t.error||pr.error){msg('Ошибка загрузки магазина. Обнови страницу чуть позже.',true);return}balance=Number(w.data?.balance||0);items=c.data||[];owned=new Set((i.data||[]).map(x=>x.item_id));equipped=pr.data||{};$('balance').textContent=balance.toLocaleString('ru-RU')+' ◈';render();$('history').innerHTML=(t.data||[]).map(x=>'<div class="tx"><span>'+esc(x.description||x.transaction_type)+'<small class="muted" style="display:block">'+new Date(x.created_at).toLocaleDateString('ru-RU')+'</small></span><b class="'+(x.amount>0?'positive':'negative')+'">'+(x.amount>0?'+':'')+Number(x.amount).toLocaleString('ru-RU')+' ◈</b></div>').join('')||'Операций пока нет.'}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});$('items').addEventListener('click',async e=>{const b=e.target.closest('[data-buy]');if(!b||b.disabled)return;b.disabled=true;b.textContent='Покупаем…';const {error}=await db.rpc('arqon_shop_buy',{p_item_id:b.dataset.buy});if(error){msg(error.message||'Не удалось купить предмет.',true);b.disabled=false;b.textContent='Купить';return}msg('Покупка прошла успешно! Предмет добавлен в инвентарь.');await load()});load();
</script></body></html>
