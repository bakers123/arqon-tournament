<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090812"><meta name="description" content="Профиль команды ARQON Esports"><title>Команда — ARQON Esports</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#090812;--panel:#151322;--line:#a879ff33;--violet:#9b5cff;--pink:#d2aaff;--muted:#a59bb6;--white:#f7f3ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#7136c944,transparent 48%),var(--bg);color:var(--white);font-family:Rajdhani,system-ui,sans-serif}a{color:inherit;text-decoration:none}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,5vw,60px);border-bottom:1px solid var(--line);background:#090812dd;position:sticky;top:0;z-index:2;backdrop-filter:blur(16px)}.brand{font:800 16px Orbitron;letter-spacing:3px}.brand span{color:var(--pink)}.back,.pill{border:1px solid var(--line);border-radius:12px;padding:9px 13px;color:#dfd1f5;font-weight:700}.wrap{width:min(1000px,calc(100% - 28px));margin:28px auto 60px}.hero{border:1px solid var(--line);border-radius:22px;padding:24px;background:linear-gradient(125deg,#211337,#39205e 55%,#151126);display:flex;align-items:center;gap:20px;min-width:0;box-shadow:0 20px 70px #0007}.logo{width:112px;height:112px;flex:0 0 112px;border-radius:22px;border:1px solid #c084fc66;background:#0d0b16;object-fit:cover}.hero h1{font:800 clamp(22px,5vw,38px) Orbitron;overflow-wrap:anywhere;margin:0 0 8px}.sub{color:#d4c5e9;font-weight:600}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.metric,.panel{border:1px solid var(--line);border-radius:17px;background:linear-gradient(160deg,#171426,#100f19);padding:18px}.metric span{display:block;color:var(--muted);font-size:14px}.metric strong{display:block;font:800 25px Orbitron;color:#e3d2ff;margin-top:8px}.panel h2{font:700 12px Orbitron;letter-spacing:2px;color:#d9c4ff;margin:0 0 16px}.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.player{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #ffffff14;border-radius:14px;background:#ffffff04;min-width:0}.avatar{width:52px;height:52px;flex:0 0 52px;border-radius:13px;object-fit:cover;background:#302143}.pname{font-size:18px;font-weight:800;overflow-wrap:anywhere}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.tag{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:2px 7px;color:#d4baff}.empty,.notice{color:var(--muted);text-align:center;padding:22px}.hidden{display:none!important}@media(max-width:620px){.wrap{margin:16px auto 40px}.hero{padding:16px;gap:13px;border-radius:17px}.logo{width:76px;height:76px;flex-basis:76px;border-radius:16px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:14px}.metric strong{font-size:20px}.roster{grid-template-columns:minmax(0,1fr)}.panel{padding:15px}.brand{font-size:13px;letter-spacing:2px}.back{font-size:13px;padding:8px 10px}}
</style></head><body><header class="top"><a class="brand" href="/"><span>ARQON</span> ESPORTS</a><a class="back" href="/players/">← Игроки</a></header><main class="wrap"><section class="hero"><img id="logo" class="logo hidden" alt=""><div><div class="sub">TEAM PROFILE</div><h1 id="team-name">Загрузка команды…</h1><div class="sub" id="team-meta"></div></div></section><div class="metrics"><div class="metric"><span>Игроки в составе</span><strong id="player-count">0</strong></div><div class="metric"><span>Средний ARQON рейтинг</span><strong id="team-rating">—</strong></div><div class="metric"><span>Средний FACEIT</span><strong id="team-faceit">—</strong></div></div><section class="panel"><h2>СОСТАВ КОМАНДЫ</h2><div class="roster" id="roster"><p class="empty">Загружаем состав…</p></div></section><div class="notice hidden" id="notice"></div></main>
<script>
const db=supabase.createClient('https://uscnaqcvuwjrmkjyuklp.supabase.co','sb_publishable_oE2Bc1wPAcDt6HE8bOUj3Q_0-2FfIxB');
const id=new URLSearchParams(location.search).get('id');const el=x=>document.getElementById(x);
function safeImage(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function render(team){
 if(!team){el('team-name').textContent='Команда не найдена';el('roster').textContent='Проверь ссылку или вернись в список игроков.';return}
 document.title=team.name+' — ARQON Esports';el('team-name').textContent=team.name||'Команда ARQON';
 const logo=safeImage(team.logo);if(logo){el('logo').src=logo;el('logo').classList.remove('hidden')}
 const players=Array.isArray(team.players)?team.players:[];const active=players.filter(p=>p.rosterRole!=='reserve');const reserves=players.filter(p=>p.rosterRole==='reserve');
 el('player-count').textContent=players.length;const ratings=players.map(p=>Number(p.arqonRating)).filter(n=>Number.isFinite(n)&&n>=0&&n<=100);el('team-rating').textContent=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1):'—';
 const faceit=players.map(p=>Number(p.faceitLevel)).filter(n=>Number.isInteger(n)&&n>=1&&n<=10);el('team-faceit').textContent=faceit.length?(faceit.reduce((a,b)=>a+b,0)/faceit.length).toFixed(1):'—';
 el('team-meta').textContent=(active.length+' основных'+(reserves.length?' · '+reserves.length+' запасных':''));const host=el('roster');host.replaceChildren();
 const add=(p,reserve)=>{const card=document.createElement('article');card.className='player';const avatar=document.createElement('img');avatar.className='avatar';avatar.alt='';avatar.src=safeImage(p.avatar)||'';avatar.onerror=()=>{avatar.removeAttribute('src')};const copy=document.createElement('div');copy.style.minWidth='0';const name=document.createElement('div');name.className='pname';name.textContent=p.name||'Игрок';const tags=document.createElement('div');tags.className='tags';if(String(p.account_id)===String(team.captainId)){const t=document.createElement('span');t.className='tag';t.textContent='Капитан';tags.append(t)}if(reserve){const t=document.createElement('span');t.className='tag';t.textContent='Запасной';tags.append(t)}if(Number.isInteger(Number(p.faceitLevel))&&Number(p.faceitLevel)>=1&&Number(p.faceitLevel)<=10){const t=document.createElement('span');t.className='tag';t.textContent='FACEIT '+p.faceitLevel;tags.append(t)}if(Number.isInteger(Number(p.arqonRating))&&Number(p.arqonRating)>=0&&Number(p.arqonRating)<=100){const t=document.createElement('span');t.className='tag';t.textContent='ARQON '+p.arqonRating+'/100';tags.append(t)}copy.append(name,tags);card.append(avatar,copy);host.append(card)};
 active.forEach(p=>add(p,false));reserves.forEach(p=>add(p,true));if(!players.length){host.innerHTML='<p class="empty">Состав пока не опубликован.</p>'}
}
async function load(){if(!id){el('team-name').textContent='Не указан ID команды';return}const {data,error}=await db.from('tournament').select('data').eq('id',1).maybeSingle();if(error)throw error;const teams=Array.isArray(data?.data?.teams)?data.data.teams:[];render(teams.find(t=>String(t.id)===String(id)))}
load().catch(e=>{console.error(e);el('team-name').textContent='Не удалось загрузить команду';el('notice').textContent='Попробуй обновить страницу.';el('notice').classList.remove('hidden')});
</script></body></html>
