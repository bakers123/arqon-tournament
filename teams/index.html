<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090812"><meta name="description" content="Команды ARQON Esports — составы и профили киберспортивных команд."><title>Команды — ARQON Esports</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#090812;--panel:#151322;--line:#a879ff33;--violet:#9b5cff;--pink:#d2aaff;--muted:#a59bb6;--white:#f7f3ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#7136c944,transparent 48%),var(--bg);color:var(--white);font-family:Rajdhani,system-ui,sans-serif}a{color:inherit;text-decoration:none}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,5vw,60px);border-bottom:1px solid var(--line);background:#090812dd;position:sticky;top:0;z-index:2;backdrop-filter:blur(16px)}.brand{font:800 16px Orbitron;letter-spacing:3px}.brand span{color:var(--pink)}.back{border:1px solid var(--line);border-radius:12px;padding:9px 13px;color:#dfd1f5;font-weight:700}.wrap{width:min(1100px,calc(100% - 28px));margin:30px auto 60px}.kicker{font:700 11px Orbitron;letter-spacing:3px;color:#bd9aff}.heading{font:800 clamp(27px,6vw,44px) Orbitron;margin:10px 0}.lead{color:var(--muted);font-size:18px;margin:0 0 22px}.toolbar{display:flex;gap:12px;margin-bottom:18px}.market-link{display:inline-flex;align-items:center;gap:9px;margin:0 0 18px;padding:11px 15px;border:1px solid #a879ff77;border-radius:12px;background:#7136c933;color:#e7d8ff;font-weight:800}.toolbar input{width:100%;min-width:0;background:#12101d;border:1px solid var(--line);border-radius:12px;padding:13px 15px;color:white;font:600 16px Rajdhani;outline:none}.count{color:var(--muted);margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.team{display:block;min-width:0;padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(155deg,#191528,#100f19);transition:transform .18s,border-color .18s,box-shadow .18s}.team:hover{transform:translateY(-2px);border-color:#b78bff88;box-shadow:0 12px 35px #0006}.head{display:flex;align-items:center;gap:13px;min-width:0}.logo{width:66px;height:66px;flex:0 0 66px;border-radius:17px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#7136c9,#211632);border:1px solid #c084fc66;font:800 18px Orbitron}.logo img{width:100%;height:100%;object-fit:cover}.name{font:800 19px Orbitron;overflow-wrap:anywhere;margin:0 0 6px}.meta{color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}.stat{padding:10px;border-radius:11px;background:#ffffff06;border:1px solid #ffffff0c;min-width:0}.stat small{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font:800 19px Orbitron;color:#e3d2ff;margin-top:4px}.roster{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:13px}.players{display:flex;align-items:center}.players img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #171426;margin-right:-6px;background:#29203a}.cta{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:13px;border-top:1px solid #ffffff12;color:#d9c4ff;font-weight:700;letter-spacing:.5px}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px;border:1px solid var(--line);border-radius:16px}.hidden{display:none!important}@media(max-width:680px){.wrap{margin:20px auto 40px}.grid{grid-template-columns:minmax(0,1fr);gap:11px}.team{padding:15px}.heading{font-size:28px}.brand{font-size:13px;letter-spacing:2px}.back{font-size:13px;padding:8px 10px}.logo{width:58px;height:58px;flex-basis:58px}.name{font-size:17px}}
</style></head><body><header class="top"><a class="brand" href="/"><span>ARQON</span> ESPORTS</a><a class="back" href="/">← На главную</a></header><main class="wrap"><div class="kicker">TEAM HUB</div><h1 class="heading">КОМАНДЫ <span style="color:#c084fc">ARQON</span></h1><p class="lead">Каталог команд, их составы и отдельные профили. Выбирай команду, чтобы узнать о ней больше.</p><a class="market-link" href="/teams/market/">⌕ ОТКРЫТЬ ТРАНСФЕРНЫЙ РЫНОК ↗</a><div class="toolbar"><input id="search" type="search" placeholder="Найти команду…" aria-label="Найти команду"></div><div class="count" id="count">Загружаем команды…</div><div class="grid" id="teams"><div class="empty">Загружаем команды ARQON…</div></div></main>
<script>
const db=supabase.createClient('https://uscnaqcvuwjrmkjyuklp.supabase.co','sb_publishable_oE2Bc1wPAcDt6HE8bOUj3Q_0-2FfIxB');
const $=id=>document.getElementById(id);let allTeams=[];
function safeUrl(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 const q=$('search').value.trim().toLocaleLowerCase();
 const list=allTeams.filter(t=>String(t.name||'').toLocaleLowerCase().includes(q));
 $('count').textContent='Команд: '+list.length+' из '+allTeams.length;
 $('teams').innerHTML=list.map(t=>{
  const players=Array.isArray(t.players)?t.players:[];
  const main=players.filter(p=>p.rosterRole!=='reserve').length,reserve=players.length-main;
  const ratings=players.map(p=>Number(p.arqonRating)).filter(n=>Number.isFinite(n)&&n>=0&&n<=100);
  const avg=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1):'—';
  const logo=safeUrl(t.logo||t.avatar),initials=String(t.name||'ARQON').split(/\s+/).map(x=>x[0]).join('').slice(0,3).toUpperCase();
  const avatars=players.slice(0,5).map(p=>safeUrl(p.avatar)).filter(Boolean).map(src=>'<img src="'+esc(src)+'" alt="" loading="lazy">').join('');
  return '<a class="team" href="/teams/profile/?id='+encodeURIComponent(t.id)+'"><div class="head"><div class="logo">'+(logo?'<img src="'+esc(logo)+'" alt="">':esc(initials))+'</div><div style="min-width:0"><h2 class="name">'+esc(t.name||'Команда ARQON')+'</h2><div class="meta">'+main+' основных · '+reserve+' запасных</div></div></div><div class="stats"><div class="stat"><small>В составе</small><strong>'+players.length+'</strong></div><div class="stat"><small>ARQON рейтинг</small><strong>'+avg+'</strong></div><div class="stat"><small>FACEIT</small><strong>'+((()=>{const a=players.map(p=>Number(p.faceitLevel)).filter(n=>Number.isInteger(n)&&n>=1&&n<=10);return a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'—'})())+'</strong></div></div><div class="roster"><span class="players">'+avatars+'</span><span>'+(players.length?esc(players.slice(0,3).map(p=>p.name).join(', '))+(players.length>3?' и ещё '+(players.length-3):''):'Состав пока не заполнен')+'</span></div><div class="cta"><span>ОТКРЫТЬ ПРОФИЛЬ КОМАНДЫ</span><span>↗</span></div></a>';
 }).join('')||'<div class="empty">Команды по этому запросу не найдены.</div>';
}
async function load(){const {data,error}=await db.from('tournament').select('data').eq('id',1).maybeSingle();if(error)throw error;allTeams=Array.isArray(data?.data?.teams)?data.data.teams:[];const {data:profiles, error:profileError}=await db.from('team_profiles').select('team_id,description,logo_url,cover_url,captain_arqon_id');if(!profileError){const byId=new Map((profiles||[]).map(p=>[String(p.team_id),p]));allTeams=allTeams.map(t=>({...t,...(byId.get(String(t.id))||{})}))}render()}
$('search').addEventListener('input',render);load().catch(e=>{$('count').textContent='Не удалось загрузить команды';$('teams').innerHTML='<div class="empty">Ошибка загрузки каталога. Попробуй обновить страницу.</div>';console.error(e)});
</script><script src="/assets/arqon-notifications.js?v=1" defer></script></body></html>
