<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090812"><meta name="description" content="Трансферный рынок игроков ARQON Esports"><title>Трансферный рынок — ARQON</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>:root{color-scheme:dark;--bg:#090812;--line:#a879ff33;--muted:#a59bb6;--white:#f7f3ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#7136c944,transparent 48%),var(--bg);color:var(--white);font-family:Rajdhani,system-ui,sans-serif}a{color:inherit;text-decoration:none}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,5vw,60px);border-bottom:1px solid var(--line);background:#090812dd;position:sticky;top:0;z-index:2;backdrop-filter:blur(16px)}.brand{font:800 16px Orbitron;letter-spacing:3px}.brand span{color:#d2aaff}.back{border:1px solid var(--line);border-radius:12px;padding:9px 13px;color:#dfd1f5;font-weight:700}.wrap{width:min(1100px,calc(100% - 28px));margin:30px auto 60px}.kicker{font:700 11px Orbitron;letter-spacing:3px;color:#bd9aff}.heading{font:800 clamp(26px,6vw,42px) Orbitron;margin:10px 0}.lead{color:var(--muted);font-size:18px}.toolbar{display:flex;gap:10px;margin:20px 0}.toolbar input,.toolbar select{min-width:0;flex:1;background:#12101d;border:1px solid var(--line);border-radius:12px;padding:13px;color:white;font:600 16px Rajdhani}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.player{padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(155deg,#191528,#100f19);min-width:0}.head{display:flex;gap:13px;align-items:center}.avatar{width:64px;height:64px;flex:0 0 64px;border-radius:16px;object-fit:cover;background:#302143}.name{font:800 18px Orbitron;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:14px}.role{display:inline-block;margin-top:7px;border:1px solid #a879ff66;border-radius:30px;padding:3px 9px;color:#e1ceff;font-size:13px}.bio{color:#c9bfd8;line-height:1.35;min-height:34px;margin:13px 0}.stats{display:flex;gap:8px;flex-wrap:wrap;color:#d9baff;font-weight:700}.cta{display:block;margin-top:14px;padding-top:12px;border-top:1px solid #ffffff14;color:#d9c4ff;font-weight:800}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:28px;border:1px solid var(--line);border-radius:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}.toolbar{flex-direction:column}.brand{font-size:13px;letter-spacing:2px}.wrap{margin:20px auto 40px}}</style></head><body><header class="top"><a class="brand" href="/"><span>ARQON</span> ESPORTS</a><a class="back" href="/teams/">← Команды</a></header><main class="wrap"><div class="kicker">PLAYER TRANSFERS</div><h1 class="heading">ТРАНСФЕРНЫЙ РЫНОК</h1><p class="lead">Игроки, которые открыли поиск команды. Открой профиль, чтобы посмотреть статистику.</p><div class="toolbar"><input id="search" type="search" placeholder="Поиск по нику или ARQON ID"><select id="role"><option value="">Все роли</option><option>AWP</option><option>Rifler</option><option>Entry</option><option>Support</option><option>IGL</option><option>Люркер</option></select><select id="elo"><option value="0">Любой FACEIT ELO</option><option value="1000">От 1000 ELO</option><option value="1500">От 1500 ELO</option><option value="2000">От 2000 ELO</option><option value="2500">От 2500 ELO</option></select></div><div class="meta" id="count">Загружаем игроков…</div><div class="grid" id="players" style="margin-top:14px"><div class="empty">Загрузка…</div></div></main><script>const db=supabase.createClient('https://uscnaqcvuwjrmkjyuklp.supabase.co','sb_publishable_oE2Bc1wPAcDt6HE8bOUj3Q_0-2FfIxB');const $=id=>document.getElementById(id);let rows=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('search').value.trim().toLocaleLowerCase(),role=$('role').value.toLocaleLowerCase(),elo=Number($('elo').value)||0;const list=rows.filter(p=>(!role||String(p.preferred_role||'').toLocaleLowerCase().includes(role))&&(!elo||(Number(p.cs2_faceit_elo)||0)>=elo)&&(!q||[p.player_name,p.display_name,String(p.arqon_id)].some(v=>String(v||'').toLocaleLowerCase().includes(q))));$('count').textContent='Игроков в поиске команды: '+list.length+' из '+rows.length;$('players').innerHTML=list.map(p=>'<article class="player"><div class="head">'+(p.avatar_url?'<img class="avatar" src="'+esc(p.avatar_url)+'" alt="">':'<div class="avatar"></div>')+'<div style="min-width:0"><div class="name">'+esc(p.display_name||p.player_name)+'</div><div class="meta">'+esc(p.player_name)+' · ARQON #'+p.arqon_id+'</div><span class="role">'+esc(p.preferred_role||'Роль не указана')+'</span></div></div><p class="bio">'+esc(p.bio||'Игрок пока не добавил описание.')+'</p><div class="stats">'+(p.cs2_faceit_elo!==null?'CS2 FACEIT '+p.cs2_faceit_elo+' ELO':'CS2 —')+' · '+(p.dota2_mmr!==null?'Dota 2 '+p.dota2_mmr+' MMR':'Dota 2 —')+'</div><a class="cta" href="/players/profile/?id='+encodeURIComponent(p.arqon_id)+'">ОТКРЫТЬ ПРОФИЛЬ ИГРОКА ↗</a></article>').join('')||'<div class="empty">Пока нет игроков, открытых для предложений. Включи поиск команды в настройках своего ARQON-профиля.</div>'}async function load(){const {data,error}=await db.rpc('list_transfer_market_players');if(error)throw error;rows=data||[];render()}$('search').addEventListener('input',render);$('role').addEventListener('change',render);$('elo').addEventListener('change',render);load().catch(e=>{$('count').textContent='Не удалось загрузить рынок';$('players').innerHTML='<div class="empty">Ошибка загрузки. Попробуй обновить страницу.</div>';console.error(e)});</script><script src="/assets/arqon-notifications.js?v=1" defer></script></body></html>
